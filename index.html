<!DOCTYPE html><html lang="en"><head>
<title>Reviews | ZCC</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--black:#0a0a08;--charcoal:#1c1c1a;--dark-mid:#2a2a27;--muted:#6b6b65;--faint:#9a9a92;--white:#f4f4ee;--amber:#c8832a;--red:#e05555;--green:#4caf7d;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--black);color:var(--white);line-height:1.6;}
  .hidden{display:none !important;}
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{width:100%;max-width:360px;border-top:2px solid var(--amber);border-bottom:2px solid var(--amber);padding:36px 0;}
  .login-box h1{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:2px;line-height:1;margin-bottom:6px;}
  .login-box p{color:var(--faint);font-size:14px;margin-bottom:28px;}
  .or{display:flex;align-items:center;gap:12px;color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;margin:18px 0;}
  .or::before,.or::after{content:'';flex:1;height:1px;background:var(--dark-mid);}
  .login-error{color:var(--red);font-size:13px;min-height:20px;margin-top:12px;}
  .page{max-width:1400px;margin:0 auto;padding:40px 20px;}
  .header{margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--dark-mid);display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .header h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;line-height:1;}
  .header-right{display:flex;gap:10px;align-items:center;font-family:'DM Mono',monospace;font-size:12px;color:var(--faint);flex-wrap:wrap;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:28px;}
  .stat-card{background:var(--dark-mid);padding:18px 20px;border-left:3px solid var(--amber);}
  .stat-label{font-family:'DM Mono',monospace;font-size:12px;color:var(--faint);margin-bottom:6px;}
  .stat-number{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;}
  .filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .filter-btn{padding:8px 16px;background:var(--dark-mid);border:1px solid var(--muted);color:var(--white);cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;}
  .filter-btn.active{background:var(--amber);color:#0a0a08;border-color:var(--amber);}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .button{padding:8px 16px;background:var(--amber);color:#0a0a08 !important;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;font-weight:500;}
  .button:hover{opacity:0.9;}
  .button:disabled{opacity:0.5;cursor:default;}
  .button.ghost{background:var(--charcoal);color:var(--white) !important;border:1px solid var(--muted);}
  .button.danger{background:var(--red);color:var(--white) !important;}
  .button.wide{width:100%;padding:12px;font-size:13px;}
  .form-group{margin-bottom:16px;}
  .form-group label{display:block;font-family:'DM Mono',monospace;font-size:12px;color:var(--faint);margin-bottom:6px;}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;background:var(--charcoal);border:1px solid var(--muted);color:var(--white);font-family:'DM Sans',sans-serif;font-size:14px;}
  .form-group textarea{min-height:90px;resize:vertical;}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--amber);}
  .loading{text-align:center;padding:40px;color:var(--faint);font-family:'DM Mono',monospace;font-size:13px;}
  .error{color:var(--red);}
  .empty{text-align:center;padding:40px;color:var(--faint);}
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .modal.active{display:flex;}
  .modal-content{background:var(--dark-mid);padding:32px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;}
  .modal-content h3{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;margin-bottom:20px;}
  .modal-buttons{display:flex;gap:12px;margin-top:24px;}
  .modal-buttons button{flex:1;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--charcoal);border:1px solid var(--amber);padding:12px 18px;font-family:'DM Mono',monospace;font-size:12px;opacity:0;transition:all .25s;z-index:200;max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.bad{border-color:var(--red);}
  @media (prefers-reduced-motion:reduce){.toast{transition:none;}}
  .review-list{display:grid;gap:16px;}
  .review{background:var(--dark-mid);border-left:3px solid var(--green);}
  .review.is-hidden{border-left-color:var(--muted);opacity:0.85;}
  .review-top{padding:20px 20px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .stars{color:var(--amber);font-size:18px;letter-spacing:2px;}
  .meta{font-family:'DM Mono',monospace;font-size:12px;color:var(--faint);text-align:right;}
  .product{padding:8px 20px 0;font-family:'DM Mono',monospace;font-size:12px;color:var(--faint);}
  .product span{color:var(--white);}
  .text{padding:12px 20px 16px;font-size:15px;max-width:72ch;}
  .row{padding:14px 20px;border-top:1px solid var(--charcoal);display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .row label{font-family:'DM Mono',monospace;font-size:12px;color:var(--faint);}
  .row select{padding:8px 10px;background:var(--charcoal);border:1px solid var(--muted);color:var(--white);font-family:'DM Mono',monospace;font-size:12px;}
  .row textarea{flex:1 1 100%;min-height:80px;padding:10px;background:var(--charcoal);border:1px solid var(--muted);color:var(--white);font-family:'DM Sans',sans-serif;font-size:14px;resize:vertical;}
  .verified{color:var(--green);}
</style></head><body>
<div id="login" class="hidden">
  <div class="login-box">
    <h1>Zero Chaos Coffee</h1>
    <p>Sign in to continue.</p>
    <button type="button" class="button wide" id="passkeyLoginBtn">Sign in with Face ID</button>
    <div class="or">or use your password</div>
    <form id="loginForm">
      <div class="form-group"><label for="loginEmail">Email</label><input type="email" id="loginEmail" autocomplete="username webauthn" required></div>
      <div class="form-group"><label for="loginPassword">Password</label><input type="password" id="loginPassword" autocomplete="current-password" required></div>
      <button type="submit" class="button wide ghost" id="loginBtn">Sign in with password</button>
    </form>
    <div class="login-error" id="loginError"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="app" class="page hidden">
  <div class="header">
    <h1>Reviews</h1>
    <div class="header-right">
      <span id="whoami"></span>
      <button class="button ghost" id="exportBtn">Export CSV</button>
      <button class="button ghost" id="addPasskeyBtn">Add Face ID</button>
      <button class="button ghost" id="signOutBtn">Sign out</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat-card"><div class="stat-label">Total</div><div class="stat-number" id="totalCount">0</div></div>
    <div class="stat-card"><div class="stat-label">Live on site</div><div class="stat-number" id="liveCount">0</div></div>
    <div class="stat-card"><div class="stat-label">Hidden</div><div class="stat-number" id="hiddenCount">0</div></div>
    <div class="stat-card"><div class="stat-label">Need a response</div><div class="stat-number" id="unansweredCount">0</div></div>
    <div class="stat-card"><div class="stat-label">Average rating</div><div class="stat-number" id="avgRating">—</div></div>
  </div>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-f="all">All</button>
    <button class="filter-btn" data-f="live">Live</button>
    <button class="filter-btn" data-f="hidden">Hidden</button>
    <button class="filter-btn" data-f="unanswered">Need a response</button>
    <button class="filter-btn" data-f="5">5 stars</button>
    <button class="filter-btn" data-f="4">4 stars</button>
    <button class="filter-btn" data-f="low">3 or fewer</button>
  </div>
  <div id="loading" class="loading">Loading reviews...</div>
  <div id="list" class="review-list"></div>
</div>
<script>
  const SUPABASE_URL = 'https://nhdypjjikdcpmjjbjalb.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZHlwamppa2RjcG1qamJqYWxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1ODM2OTksImV4cCI6MjA5MzE1OTY5OX0.hF4kQsmUiCnSvHlIsQZMEoNha_xDq5307CNJRbPiypY';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { experimental: { passkey: true } }
  });
  const $ = id => document.getElementById(id);

  function esc(s) {
    if (s === null || s === undefined || s === '') return '—';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  let toastTimer;
  function toast(msg, bad) {
    const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', 3200);
  }

  function showLogin() { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }
  function showApp(user) {
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('whoami').textContent = user.email || '';
    onSignedIn();
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Signing in...'; $('loginError').textContent = '';
    const { data, error } = await db.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPassword').value });
    btn.disabled = false; btn.textContent = 'Sign in with password';
    if (error) { $('loginError').textContent = 'Sign-in failed: ' + error.message; return; }
    $('loginPassword').value = ''; showApp(data.user);
  });

  $('passkeyLoginBtn').addEventListener('click', async () => {
    $('loginError').textContent = '';
    try {
      const { data, error } = await db.auth.signInWithPasskey();
      if (error) throw error;
      showApp(data.user || data.session.user);
    } catch (err) {
      $('loginError').textContent = 'Face ID sign-in did not work: ' + (err.message || err) + '. Use your password, then tap "Add Face ID" once signed in.';
    }
  });

  $('addPasskeyBtn').addEventListener('click', async () => {
    try {
      const { error } = await db.auth.registerPasskey();
      if (error) throw error;
      toast('Face ID added. Next time, tap "Sign in with Face ID".');
    } catch (err) {
      toast('Could not add Face ID: ' + (err.message || err), true);
    }
  });

  $('signOutBtn').addEventListener('click', async () => { await db.auth.signOut(); location.reload(); });

  (async () => {
    const { data } = await db.auth.getSession();
    if (data.session) showApp(data.session.user); else showLogin();
  })();
  // Google Sheets backup (unchanged from your previous page)
  const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbwSMrAe48xhSc0yhDUDe3l1yavIBLwBnL5Hv-PBY1fO9Zjr0D13r0qB4oBSjb4_HnGOLQ/exec';
  let reviews = [], filter = 'all';
  // The storefront only shows rows where status is exactly 'approved' (lowercase).
  const isLive = r => r.status === 'approved';
  function onSignedIn() { loadReviews(); }
  async function loadReviews() {
    const { data, error } = await db.from('Reviews').select('*').order('created_at', { ascending: false });
    if (error) { $('loading').innerHTML = '<span class="error">Could not load reviews: ' + esc(error.message) + '</span>'; return; }
    reviews = data || []; $('loading').style.display = 'none'; stats(); render();
  }
  function stats() {
    $('totalCount').textContent = reviews.length;
    $('liveCount').textContent = reviews.filter(isLive).length;
    $('hiddenCount').textContent = reviews.filter(r => !isLive(r)).length;
    $('unansweredCount').textContent = reviews.filter(r => !r.response || !r.response.trim()).length;
    const rated = reviews.filter(r => r.rating);
    $('avgRating').textContent = rated.length ? (rated.reduce((a, r) => a + Number(r.rating), 0) / rated.length).toFixed(1) : '—';
  }
  function render() {
    let rows = reviews;
    if (filter === 'live') rows = rows.filter(isLive);
    if (filter === 'hidden') rows = rows.filter(r => !isLive(r));
    if (filter === 'unanswered') rows = rows.filter(r => !r.response || !r.response.trim());
    if (filter === '5') rows = rows.filter(r => Number(r.rating) === 5);
    if (filter === '4') rows = rows.filter(r => Number(r.rating) === 4);
    if (filter === 'low') rows = rows.filter(r => Number(r.rating) <= 3);
    if (!rows.length) { $('list').innerHTML = '<div class="empty">No reviews in this view.</div>'; return; }
    $('list').innerHTML = rows.map(r => {
      const n = Math.max(0, Math.min(5, Number(r.rating) || 0));
      const status = isLive(r) ? 'approved' : (r.status === 'rejected' ? 'rejected' : 'pending');
      return `<div class="review ${isLive(r) ? '' : 'is-hidden'}">
        <div class="review-top">
          <div class="stars" aria-label="${n} of 5 stars">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</div>
          <div class="meta">${esc(r.name)}${r.verified ? ' <span class="verified">✔ verified</span>' : ''}<br>${r.created_at ? new Date(r.created_at).toLocaleDateString() : ''}</div>
        </div>
        <div class="product">Product: <span>${esc(r.product_title)}</span>${r.stood_out ? ` · Stood out: <span>${esc(r.stood_out)}</span>` : ''}</div>
        <div class="text">${esc(r.review)}</div>
        <div class="row">
          <label for="st-${esc(r.id)}">Status</label>
          <select id="st-${esc(r.id)}" data-status="${esc(r.id)}">
            <option value="approved" ${status === 'approved' ? 'selected' : ''}>Live on site</option>
            <option value="pending" ${status === 'pending' ? 'selected' : ''}>Hidden (pending)</option>
            <option value="rejected" ${status === 'rejected' ? 'selected' : ''}>Hidden (rejected)</option>
          </select>
        </div>
        <div class="row">
          <label for="rs-${esc(r.id)}">Your response</label>
          <textarea id="rs-${esc(r.id)}" placeholder="Write a response...">${r.response ? esc(r.response) : ''}</textarea>
          <button class="button" data-save="${esc(r.id)}">Save response</button>
          <button class="button ghost" data-clear="${esc(r.id)}">Remove response</button>
        </div>
      </div>`;
    }).join('');
  }
  async function patch(id, fields, okMsg) {
    const { data, error } = await db.from('Reviews').update(fields).eq('id', id).select();
    if (error || !data || !data.length) { toast('Update failed: ' + (error ? error.message : 'no row updated'), true); return; }
    const i = reviews.findIndex(x => x.id === id); reviews[i] = data[0];
    syncToSheets(data[0]); stats(); render(); toast(okMsg);
  }
  $('list').addEventListener('change', e => {
    const sel = e.target.closest('[data-status]'); if (!sel) return;
    patch(sel.dataset.status, { status: sel.value }, sel.value === 'approved' ? 'Review is live on the site' : 'Review hidden from the site');
  });
  $('list').addEventListener('click', e => {
    const s = e.target.closest('[data-save]'), c = e.target.closest('[data-clear]');
    if (s) patch(s.dataset.save, { response: $('rs-' + s.dataset.save).value.trim(), responded_at: new Date().toISOString() }, 'Response saved');
    if (c) patch(c.dataset.clear, { response: null, responded_at: null }, 'Response removed');
  });
  $('filters').addEventListener('click', e => { const b = e.target.closest('.filter-btn'); if (!b) return;
    document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); filter = b.dataset.f; render(); });
  async function syncToSheets(r) {
    if (!SHEETS_URL || !r) return;
    try { await fetch(SHEETS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({
      timestamp: r.created_at || new Date().toISOString(), date: r.created_at || '', name: r.name || '', stars: r.rating || '',
      product: r.product_title || '', stood_out: r.stood_out || '', text: r.review || '', status: r.status || '',
      response: r.response || '', verified: r.verified ? 'YES' : 'NO' }) }); } catch (e) { console.warn('Sheets sync failed', e); }
  }
  $('exportBtn').addEventListener('click', () => {
    if (!reviews.length) return;
    const head = ['Date','Name','Rating','Product','Stood Out','Review','Status','Response'];
    const rows = reviews.map(r => [r.created_at, r.name, r.rating, r.product_title, r.stood_out, r.review, r.status, r.response].map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(','));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([[head.join(','), ...rows].join('\n')], { type: 'text/csv' }));
    a.download = 'zcc-reviews-' + new Date().toISOString().split('T')[0] + '.csv'; a.click();
  });
</script></body></html>
